name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependency
        run: sudo apt-get update && sudo apt-get install -y file
      - name: Run tests
        run: PYTHONPATH=. python3 -m unittest discover -s tests -v
